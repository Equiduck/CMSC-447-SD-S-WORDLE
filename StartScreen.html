<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Shared-state Wordle - Sprint 1 layout skeleton (separator bar + 6x5 grid)"
    />
    <title>Shared-State Wordle - Sprint 1 skeleton</title>
    <!-- No build step: open this file directly, or serve the folder. -->
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/StartScreen.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif+Caption:ital@0;1&display=swap" rel="stylesheet">
  </head>

  <body>  
    <header>
      <nav>
        <ul>
          <a href="StartScreen.html"><i class="fa fa-fw fa-home"></i> </a> 
          <a href="history.html"><i class="fa fa-fw fa-history"></i> </a> 
          <a href="#"><i class="fa fa-fw fa-cog"></i> </a> 
        </ul>
      </nav>
    </header>

    <div class="container">  
      <div class = "centeredItems">
        <img src = "Project-Photos/Wordle_Logo.svg" alt = "Two-Player Wordle Logo">
        <h1><b>Two-Player Wordle</b></h1>
        <h2>Wordle with a little twist...</h2>

        <ul>
          <button onclick="location.href='index.html'">Play</button>
          <button onclick="openLogin()">Log in</button>
          <button onclick="openSignUp()">Sign up</button>
        </ul>

        <div class="login-popup" id="loginForm">
          <form class="login-container">
            <h1>Login</h1>

            <label for="user">Username</label>
            <input type="text" placeholder="Enter Username" name="user" required>

            <label for="psw">Password</label>
            <input type="password" placeholder="Enter Password" name="psw" required>

            <button type="submit" >Login</button>
            <button onclick="closeLogin()">Close</button>
          </form>
        </div>

        <div class="signup-popup" id="signupForm">
          <form class="signup-container">
            <h1>Sign up</h1>

            <label for="user">Username</label>
            <input type="text" placeholder="Enter Username" name="user" required>

            <label for="psw">Password</label>
            <input type="password" placeholder="Enter Password" name="psw" required>

            <button type="submit" >Sign up</button>
            <button onclick="closeSignUp()">Close</button>
          </form>
        </div>


        <div class="popup" id="popup">
          <div class = "top">
            <a href = "#" class = "exitButton" id = "exitButton"> &times</a>
          </div>

          <h1> Language Selector</h1>
          <h2> Please Select Your Preferred Game Language</h2>

          <a href = "index.html" class = "averageButton"> English</a>
          <a href = "index.html" class = "averageButton"> Spanish</a>
        </div>

        <p id = "currentDate"></p>

        <script src = "javascript/StartScreen.js"></script>
      </div>
    </div>
  </body>  
</html>
