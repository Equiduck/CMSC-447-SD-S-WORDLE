<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Wordle | Shared-State Wordle</title>
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/online.css">
</head>
<body class="online-page">
  <main class="online-shell">
    <img class="online-logo" src="./Project-Photos/Wordle_Logo.svg" alt="Wordle">
    <h1>Two-Player Wordle</h1>
    <p class="online-subtitle">Play online with a friend or find an opponent.</p>
    <nav class="online-nav"><a href="StartScreen.html">Back to Wordle</a></nav>

    <section class="online-card" aria-labelledby="connection-title">
      <h2 id="connection-title">Server Settings</h2>
      <form id="serverForm" class="online-form">
        <label for="apiBaseUrl">Team A server URL</label>
        <div class="online-inline">
          <input id="apiBaseUrl" type="url" placeholder="http://127.0.0.1:5000" required>
          <button type="submit" class="online-button">Save</button>
        </div>
      </form>
      <p id="serverFeedback" class="online-message" role="status" aria-live="polite"></p>
    </section>

    <section class="online-card" aria-labelledby="account-title">
      <h2 id="account-title">Account</h2>
      <form id="loginForm" class="online-form">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button id="loginButton" class="online-button" type="submit">Log In</button>
      </form>
      <div id="signedIn" hidden>
        <p id="accountName"></p>
        <button id="logoutButton" class="online-button" type="button">Sign Out</button>
      </div>
      <p id="loginFeedback" class="online-message" role="status" aria-live="polite"></p>
      <p class="online-note">New account registration is awaiting Team A's API.</p>
    </section>

    <section class="online-card" aria-labelledby="play-title">
      <h2 id="play-title">Online Play</h2>
      <p class="online-note">Games use your server account's language preference.</p>
      <div class="online-action-grid">
        <button id="createButton" class="online-button" type="button">Create Invite</button>
        <button id="matchButton" class="online-button" type="button">Find Opponent</button>
        <button id="resumeButton" class="online-button" type="button">Resume Game</button>
      </div>
      <form id="joinForm" class="online-form">
        <label for="inviteId">Join a friend's invitation</label>
        <input id="inviteId" placeholder="Paste game UUID" autocomplete="off" spellcheck="false" required>
        <button id="joinButton" class="online-button" type="submit">Join Invite</button>
      </form>
      <div id="queuePanel" class="online-queue" hidden>
        <span class="online-spinner" aria-hidden="true"></span>
        <p>Looking for an opponent…</p>
        <button id="cancelQueueButton" class="online-button" type="button">Cancel Matchmaking</button>
      </div>
      <p id="playFeedback" class="online-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="./javascript/api-client.js"></script>
  <script src="./javascript/online-lobby.js"></script>
</body>
</html>
