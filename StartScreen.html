<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Shared-state Wordle - Sprint 1 layout skeleton (separator bar + 6x5 grid)"
    />
    <title>Shared-State Wordle - Sprint 1 skeleton</title>
    <!-- No build step: open this file directly, or serve the folder. -->
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/StartScreen.css"/>
    <link rel="stylesheet" href="./styles/login.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif+Caption:ital@0;1&display=swap" rel="stylesheet">
  </head>

  <body>  
    <header>
      <nav>
        <ul>
          <li><a href="StartScreen.html" aria-label="Start Screen"><i class="fa fa-fw fa-home" aria-hidden="true"></i></a></li>
          <li><a href="history.html" aria-label="History"><i class="fa fa-fw fa-history" aria-hidden="true"></i></a></li>
          <li><a href="#" id="languageButton" aria-label="Language Selector"><i class="fa fa-fw fa-cog" aria-hidden="true"></i></a></li>
        </ul>
      </nav>
    </header>

    <div class="container">  
      <div class = "centeredItems">
        <img src = "Project-Photos/Wordle_Logo.svg" alt = "Two-Player Wordle Logo">
        <h1><b>Two-Player Wordle</b></h1>
        <h2>Wordle with a little twist...</h2>

        <ul>
          <button id="playButton" type="button">Play</button>
          <button type="button" onclick="openLogin()">Log in</button>
          <button type="button" onclick="openSignUp()">Sign up</button>
        </ul>

        <p id = "currentDate"></p>
      </div>
    </div>

    <div class="login-popup" id="loginForm">
      <form class="login-container" onsubmit="event.preventDefault()">
        <h1>Login</h1>

        <label for="loginUser">Username</label>
        <input id="loginUser" type="text" placeholder="Enter Username" name="user" required>

        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="Enter Password" name="psw" required>

        <button type="submit">Login</button>
        <button type="button" onclick="closeLogin()">Close</button>
      </form>
    </div>

    <div class="signup-popup" id="signupForm">
      <form class="signup-container" onsubmit="event.preventDefault()">
        <h1>Sign up</h1>

        <label for="signupUser">Username</label>
        <input id="signupUser" type="text" placeholder="Enter Username" name="user" required>

        <label for="signupPassword">Password</label>
        <input id="signupPassword" type="password" placeholder="Enter Password" name="psw" required>

        <button type="submit">Sign up</button>
        <button type="button" onclick="closeSignUp()">Close</button>
      </form>
    </div>

    <div class="popup" id="langOpt">
      <div class="top">
        <a href="#" class="exitButton" id="exitButton" aria-label="Close language selector">&times;</a>
      </div>

      <h1 id="language-popup-title">Language Selector</h1>
      <h2 id="language-popup-description">Please Select Your Preferred Game Language</h2>

      <a href="#" class="averageButton" data-language="en">English</a>
      <a href="#" class="averageButton" data-language="es">Spanish</a>
    </div>

    <script src="./javascript/StartScreen.js"></script>
  </body>  
</html>
