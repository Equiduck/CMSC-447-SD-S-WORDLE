<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Game Statistics</title>

    <link rel="stylesheet" href="./styles/player-stats.css">
</head>

<body>

    <!--Navigation buttons-->
    <nav class="stats-navigation">
        <a href="./StartScreen.html" class="nav-button">StartScreen</a>
        <a href="./index.html" class="nav-button">Play</a>
        <a href="./history.html" class="nav-button">History</a>
    </nav>

    <main class="statistics-page">

        <h1>Statistics</h1>

        <!--Player statistic information, ike wr and streak-->
        <section class="statistics-summary">

            <div class="stat">
                <h2>Games Played</h2>
                <p id="games-played">--</p>
            </div>

            <div class="stat">
                <h2>Total Wins</h2>
                <p id="total-wins">--</p>
            </div>

            <div class="stat">
                <h2>Total Losses</h2>
                <p id="total-losses">--</p>
            </div>

            <div class="stat">
                <h2>Win Rate</h2>
                <p id="win-rate">--</p>
            </div>

            <div class="stat">
                <h2>Current Streak</h2>
                <p id="current-streak">--</p>
            </div>

            <div class="stat">
                <h2>Max Streak</h2>
                <p id="max-streak">--</p>
            </div>

        </section>

        <!--Guess distribution graph-->
        <section class="guess-section">

            <h2>Guess Distribution</h2>
            <div class="guess-chart" id="guess-chart">
                <!--The javascript file will be in charge of creating the bars-->
            </div>
        </section>
    </main>

    <script src="./javascript/statistics.js"></script>

</body>
</html>
